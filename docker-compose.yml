services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ellmer-practice

    restart: unless-stopped

    env_file:
      - config.env

    networks:
      - edge

    volumes:
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3838/"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
